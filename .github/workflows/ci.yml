name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          # Build only needs these to exist; nothing is fetched at build time.
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

  db:
    name: Database — migrations, SQL tests, types, reminders e2e
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Migrations + SQL tests
        run: supabase/tests/run.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Generated types match migrations
        working-directory: web
        run: |
          npm run -s gen:types:db
          git diff --exit-code -- lib/database.types.ts \
            || { echo "::error::lib/database.types.ts is stale — run 'npm run gen:types:db' against a migrated DB and commit"; exit 1; }

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function typecheck
        run: deno check supabase/functions/appointment_reminders/index.ts

      - name: Start PostgREST
        run: |
          docker run -d --name postgrest --network host \
            -e PGRST_DB_URI="$DATABASE_URL" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$JWT_SECRET" \
            postgrest/postgrest:latest
          for _ in $(seq 1 30); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
      - name: Reminders e2e
        run: supabase/tests/e2e/run.sh
        env:
          POSTGREST_URL: http://localhost:3000

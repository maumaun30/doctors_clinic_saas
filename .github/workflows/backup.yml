name: Nightly backup

# Encrypted copy of the production database and stored files, kept for
# 30 days as a workflow artifact. Restore steps: docs/backups.md.
on:
  schedule:
    - cron: "0 18 * * *" # 02:00 Asia/Manila
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Dump, encrypt, upload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKUP_DB_URL: ${{ secrets.BACKUP_DB_URL }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
      SUPABASE_URL: ${{ secrets.BACKUP_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BACKUP_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check secrets
        run: |
          missing=0
          for v in BACKUP_DB_URL BACKUP_AGE_RECIPIENT SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::secret for $v is not set (see docs/backups.md)"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Dump database
        run: |
          mkdir -p backup/db
          supabase db dump --db-url "$BACKUP_DB_URL" --role-only -f backup/db/roles.sql
          supabase db dump --db-url "$BACKUP_DB_URL" -f backup/db/schema.sql
          # Vector tables are platform-owned (unused here) and can't be restored as postgres.
          supabase db dump --db-url "$BACKUP_DB_URL" --data-only --use-copy \
            -x storage.buckets_vectors,storage.vector_indexes -f backup/db/data.sql
          # schema.sql skips the storage schema, so keep its access policies separately.
          psql "$BACKUP_DB_URL" -Atq -v ON_ERROR_STOP=1 > backup/db/storage_policies.sql <<'SQL'
          select format('drop policy if exists %I on %I.%I;%screate policy %I on %I.%I as %s for %s to %s%s%s;',
                        policyname, schemaname, tablename, E'\n', policyname, schemaname, tablename,
                        permissive, cmd, array_to_string(roles, ', '),
                        coalesce(' using (' || qual || ')', ''), coalesce(' with check (' || with_check || ')', ''))
            from pg_policies where schemaname = 'storage' order by tablename, policyname;
          SQL
          # A dump that silently came back empty is worse than a failed run.
          grep -q '^COPY "public"."patients"' backup/db/data.sql || { echo "::error::data.sql has no patients table"; exit 1; }
          grep -q '^COPY "auth"."users"' backup/db/data.sql || { echo "::error::data.sql has no auth.users table"; exit 1; }
          grep -q '^create policy' backup/db/storage_policies.sql || { echo "::error::no storage policies dumped"; exit 1; }
          ls -l backup/db

      - name: Download stored files
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          node scripts/backup-storage.mjs ../backup/storage

      - name: Encrypt
        run: |
          stamp=$(TZ=Asia/Manila date +%Y-%m-%d)
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          tar -czf - backup | age -r "$BACKUP_AGE_RECIPIENT" -o "clinic-backup-$stamp.tar.gz.age"
          rm -rf backup
          ls -l clinic-backup-*.age

      - uses: actions/upload-artifact@v4
        with:
          name: clinic-backup-${{ env.STAMP }}
          path: clinic-backup-*.tar.gz.age
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

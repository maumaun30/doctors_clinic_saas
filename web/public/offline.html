<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Doctors Clinic</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #0a0a0b; --muted: #6b7280; --accent: #3b82f6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0b; --fg: #fafafa; --muted: #9ca3af; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; text-align: center; }
  img { width: 56px; height: 56px; }
  h1 { font-size: 18px; margin: 16px 0 4px; }
  p { margin: 0 0 20px; color: var(--muted); max-width: 320px; }
  button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You’re offline</h1>
  <p>Doctors Clinic needs an internet connection. Check your Wi-Fi or mobile data, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
